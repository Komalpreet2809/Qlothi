<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qlothi | Shop the Look</title>
    <link rel="stylesheet" href="results.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">Q</span>
            <span class="logo">Qlothi</span>
        </div>
        <div class="search-info">
            <span id="searching-for">Results for</span>
            <strong id="item-query">...</strong>
        </div>
    </header>

    <main class="container">
        <aside class="sidebar">
            <div class="source-img-card panel">
                <h2>Your inspiration</h2>
                <div class="img-frame">
                    <img id="source-image" src="" alt="Source outfit">
                </div>
            </div>

            <div class="tryon-card panel">
                <h2>Virtual try-on</h2>
                <button id="tryon-btn" class="tryon-btn">
                    Try it on me
                </button>
                <p class="tryon-note" id="tryon-note">Uses the photo saved in your Qlothi wardrobe.</p>
            </div>
        </aside>

        <section class="results-grid" id="results-grid">
            <!-- Items injected by results.js -->
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Finding visually similar products</p>
            </div>
        </section>
    </main>

    <footer>Qlothi for Pinterest</footer>

    <script src="results.js"></script>
</body>
</html>
